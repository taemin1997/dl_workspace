[project]
name = "dl-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "konlpy>=0.6.0",
    "matplotlib>=3.11.1",
    "matplotlib-inline>=0.2.2",
    "mglearn>=0.2.0",
    "missingno>=0.5.2",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydotplus>=2.0.2",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "response>=0.5.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[project.scripts]
dl-workspace = "dl_workspace:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
